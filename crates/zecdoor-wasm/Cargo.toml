[package]
name = "zecdoor-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Browser-side Zcash keys, fresh Orchard addresses, address checks and a view-only Ironwood arrival scan for ZecDoor"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zcash_keys = { version = "0.16.1", default-features = false, features = ["orchard"] }
zcash_protocol = "0.10.6"
zcash_address = "0.13"
zcash_client_backend = { version = "0.24.0", default-features = false, features = ["orchard"] }
zcash_note_encryption = "0.4.1"
orchard = { version = "0.15.5", default-features = false, features = ["std"] }
zip32 = "0.2"
bip0039 = { version = "0.14", default-features = false, features = ["std"] }
prost = "0.14"
getrandom = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
zeroize = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-sign-ext", "--enable-mutable-globals", "--enable-nontrapping-float-to-int", "--enable-reference-types", "--enable-multivalue"]
